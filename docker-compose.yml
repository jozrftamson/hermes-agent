version: '3.9'

services:
  # ============================================================================
  # HERMES - Self-Hosted Local Development
  # ============================================================================
  hermes:
    image: hermes-agent:latest
    container_name: hermes-local
    restart: unless-stopped
    network_mode: host
    volumes:
      - ~/.hermes:/opt/data
      - ./prompts/exports/hermes_skills.json:/opt/hermes/skills/custom_skills.json:ro
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
      - API_SERVER_KEY=${HERMES_API_KEY}
      - API_SERVER_HOST=127.0.0.1
    ports:
      - "9000:9000"  # Dashboard
      - "9001:9001"  # API Server
    command: ["gateway", "run"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  hermes-dashboard:
    image: hermes-agent:latest
    container_name: hermes-dashboard-local
    restart: unless-stopped
    network_mode: host
    depends_on:
      - hermes
    volumes:
      - ~/.hermes:/opt/data
    environment:
      - HERMES_UID=${HERMES_UID:-1000}
      - HERMES_GID=${HERMES_GID:-1000}
    command: ["dashboard", "--host", "127.0.0.1", "--no-open"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9119/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # SMART ROUTER - API Gateway mit Load-Balancing
  # ============================================================================
  smart-router:
    build:
      context: .
      dockerfile: Dockerfile.router
    container_name: smart-router
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NOUS_API_KEY=${NOUS_API_KEY}
      - HERMES_API_KEY=${HERMES_API_KEY}
      - LOG_LEVEL=INFO
    volumes:
      - ./router_logs.jsonl:/app/router_logs.jsonl
      - ./deployment_results.json:/app/deployment_results.json
    depends_on:
      - hermes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ============================================================================
  # POSTGRES - Für erweiterte Monitoring & Logging
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: prompt-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=prompts
      - POSTGRES_PASSWORD=${DB_PASSWORD:-prompts123}
      - POSTGRES_DB=prompts_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prompts"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # PROMETHEUS - Monitoring
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - smart-router

  # ============================================================================
  # GRAFANA - Visualization
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # ============================================================================
  # MINIO - S3-compatible storage für Prompt Backups
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: minio-storage
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=${MINIO_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/minio_data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  minio_data:

networks:
  default:
    name: prompt-network
