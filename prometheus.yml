global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'smart-router'
    static_configs:
      - targets: ['localhost:8080']

  - job_name: 'hermes'
    static_configs:
      - targets: ['localhost:9001']

  - job_name: 'postgres'
    static_configs:
      - targets: ['localhost:5432']
